name: tests

on:
  push:
    branches: [main, "v0.*", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q --junitxml=results/runs/tests.xml
      - name: Run v0.1.1 entailment benchmark
        run: |
          python experiments/run_v0_1_1_entailment.py --regenerate --events 5000
          echo "--- entailment_v0_1_1.csv ---"
          cat results/entailment_v0_1_1.csv
      - name: Run v0.2.0 window smoke test
        run: |
          python experiments/run_v0_2_windows.py --regenerate --events 300 --width 60 --slide 15 --flush
          echo "--- window_trace_v0_2_0.csv (first rows) ---"
          head -n 5 results/window_trace_v0_2_0.csv
      - name: Run v0.2.1 recomputation smoke test
        run: |
          python experiments/run_v0_2_recompute.py --regenerate --events 300 --width 60 --slide 15 --flush
          echo "--- recompute_v0_2_1.csv (first rows) ---"
          head -n 5 results/recompute_v0_2_1.csv
      - name: Run v0.2.2 incremental equivalence smoke test
        run: |
          python experiments/run_v0_2_incremental.py --regenerate --events 500 --width 120 --slide 30 --flush
          echo "--- incremental_v0_2_2.csv (first rows) ---"
          head -n 5 results/incremental_v0_2_2.csv
      - name: Run v0.2.4 comparative benchmark evidence bundle
        run: |
          python experiments/run_v0_2_benchmark.py --regenerate --events 5000 --scenarios 3600:60,3600:300,3600:900 --output-dir results/runs/v024
          cat results/runs/v024/summary.csv
      - name: Run v0.3 cost-aware policy comparison
        run: python experiments/run_v0_3_policy.py --events 1000 --scenarios 120:30,120:120 --repetitions 2 --flush --output-dir results/runs/v030
      - name: Run v0.4 resource-aware placement comparison
        run: python experiments/run_v0_4_placement.py --events 1000 --scenarios 120:30,120:120 --flush --output-dir results/runs/v040
      - name: Run v0.5.2 recovery acceptance matrix
        run: python experiments/run_v0_5_recovery.py --events 1000 --width 120 --slide 30 --flush --require-expected-outcomes --output-dir results/runs/v052
      - name: Run v0.6.1 process-kill and resume acceptance matrix
        run: python experiments/run_v0_6_resume.py --events 300 --width 120 --slide 30 --flush --output-dir results/runs/v061
      - name: Preserve benchmark evidence and test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: results/runs/
          if-no-files-found: error
          retention-days: 30

  service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install optional service and test extras
        run: pip install -c constraints-service.txt ".[service,test]"
      - name: Initialize service evidence directory
        run: python -c "from pathlib import Path; Path('results/runs').mkdir(parents=True, exist_ok=True)"
      - name: Verify service, API and actual controller/worker restart boundaries
        run: pytest -q tests/test_job_service.py tests/test_job_api.py tests/test_job_restart.py tests/test_job_http.py --basetemp=results/runs/service-tmp --junitxml=results/runs/service-tests.xml
      - name: Build non-root local service image
        run: docker build -t adaptive-kg-service:v071 .
      - name: Verify container and persistent-volume restart
        run: python experiments/container_service_check.py --output-dir results/runs/v071-container
      - name: Preserve service diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: service-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: results/runs/

  windows-ownership:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install constrained core test environment
        run: pip install -r requirements.txt -c constraints-service.txt
      - name: Initialize Windows service evidence directory
        run: python -c "from pathlib import Path; Path('results/runs').mkdir(parents=True, exist_ok=True)"
      - name: Verify Windows worker ownership and controller restart
        run: pytest -q tests/test_job_service.py tests/test_job_restart.py --basetemp=results/runs/windows-service-tmp --junitxml=results/runs/windows-service-tests.xml
      - name: Preserve Windows test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-service-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: results/runs/
