name: tests

on:
  push:
    branches: [main, "v0.1.1-semantic-entailment"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run v0.1.1 entailment benchmark
        run: |
          python experiments/run_v0_1_1_entailment.py --regenerate --events 5000
          echo "--- entailment_v0_1_1.csv ---"
          cat results/entailment_v0_1_1.csv
